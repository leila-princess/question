# Windows 便携版 Redis 最小配置（ZNWD 会话记忆）
# 由 scripts/redis/install_redis_offline.ps1 复制到 tools/redis/

bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300

# 离线机常无持久化目录写权限：关闭 RDB 避免 stop-writes-on-bgsave-error
save ""
appendonly no

# 与 backend/config.py 中 config_set 一致
stop-writes-on-bgsave-error no

maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice
